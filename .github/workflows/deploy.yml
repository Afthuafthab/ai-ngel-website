name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site files
        run: |
          mkdir dist
          cp -r index.html thanks.html robots.txt sitemap.xml netlify.toml favicon.ico manifest.webmanifest css js vendor fonts assets dist/
      - name: Deploy to production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir dist --site "$NETLIFY_SITE_ID" --message "GitHub ${{ github.sha }}"
